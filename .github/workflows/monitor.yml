name: monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          python -m playwright install --with-deps chrome

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_TZ: Africa/Cairo
        run: python -m pop_hunt.main

      - name: Commit data if it changed
        run: |
          git config user.name "pop-hunt bot"
          git config user.email "actions@github.com"
          git add state.json data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: update booking state [skip ci]"
            git push
          fi

      - name: Stage dashboard data
        run: |
          mkdir -p site/public/data
          cp data/snapshot.json site/public/data/ 2>/dev/null || true
          cp data/events.json  site/public/data/ 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build dashboard
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Deploy dashboard
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=pop-hunt
